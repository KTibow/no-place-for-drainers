name: no place for drainers

on:
  schedule:
    # Daily, offset off the hour so we are not competing with everyone's cron.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: no-place-for-drainers
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # pnpm, node, and the install, all in one step. Both versions come from
      # devEngines in package.json.
      - uses: pnpm/setup@v2
        with:
          cache: true

      - name: scan
        env:
          # The workflow token is enough for public reads; set a GITHUB_PAT
          # secret to get the 5,000/hr core limit instead of 1,000/hr.
          GITHUB_PAT: ${{ secrets.GITHUB_PAT || github.token }}
          CROF_KEY: ${{ secrets.CROF_KEY }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          pnpm scan 2>&1 | tee scan.log

      # Always, even when the scan exits non-zero on a missed canary: a broken
      # run still produced evidence, and its summary is how you find out when
      # it broke.
      - name: commit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add out
          if git diff --staged --quiet; then
            echo "no change in out/"
            exit 0
          fi
          summary=$(ls -1 out/summary-*.json | tail -1)
          git commit -m "scan $(basename "$summary" .json | cut -d- -f2-): $(jq -r .confirmed "$summary") confirmed, $(jq -r '.takedowns | length' "$summary") already down"
          # A scan runs for the better part of an hour, so main may well have
          # moved under it. Results are additive — replaying them on top is
          # always the right merge.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

      # The console log is the detailed record — every line carries its
      # hostname, so one grep replays a site's whole life. Too big to commit,
      # worth keeping longer than the default log retention.
      - name: upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log-${{ github.run_id }}
          path: scan.log
          retention-days: 90
          if-no-files-found: warn

  publish:
    needs: scan
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
