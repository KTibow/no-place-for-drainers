name: pages

on:
  # Called by the scan workflow once it has committed a new day of results.
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Follow the branch, not the triggering SHA: when the scan workflow
          # calls this, the commit it just pushed is newer than that SHA, and
          # the whole point is to publish it.
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
